<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คลังองค์ธรรมเพราะอวิชชาดับ</title>
<meta name="description" content="คลังองค์ธรรมเพราะอวิชชาดับ อ่าน คัดลอก และส่งต่อทาง LINE">
<meta property="og:title" content="คลังองค์ธรรมเพราะอวิชชาดับ">
<meta property="og:description" content="อ่าน คัดลอก และส่งต่อทาง LINE">
<meta property="og:image" content="images/hero.jpg">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="เพราะอวิชชาดับ">
<meta name="application-name" content="เพราะอวิชชาดับ">
<meta name="theme-color" content="#f3e9d4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#173621" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=Sarabun:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css?v=20261016f">
</head>
<body>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false"><defs>
<linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e3a8"/><stop offset=".5" stop-color="#d4a94f"/><stop offset="1" stop-color="#a87a2c"/></linearGradient>
<linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9e6"/><stop offset="1" stop-color="#d6457a"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a2c2c"/><stop offset="1" stop-color="#5a1a1a"/></linearGradient>
</defs></svg>
<div class="shell">

<div class="acctwrap" id="acctwrap">
  <button type="button" class="acct" id="acct">เข้าสู่ระบบ</button>
  <div class="amenu" id="amenu" hidden>
    <span id="adminWho"></span>
    <button type="button" id="pendingBtn" hidden>รอตรวจ</button>
    <button type="button" id="settingsBtn" hidden>ตั้งค่ารหัส</button>
    <button type="button" id="logout">ออกจากระบบ</button>
  </div>
</div>
<span class="astatus" id="astatus" aria-live="polite"></span>

<header class="bar"><div class="col pad">
  <button class="back" id="back" type="button" hidden>‹ กลับ</button>
  <span class="brand" id="brand"></span>
  <div class="size"><button id="smaller" type="button" aria-label="ตัวเล็กลง">ก-</button><button id="bigger" type="button" aria-label="ตัวใหญ่ขึ้น">ก+</button></div>
</div></header>

<div id="home" class="view">
  <section class="hero"><div class="col pad">
    <div class="bwrap"><a id="heroLink" href="#" target="_blank" rel="noopener"><img class="banner" id="heroImg" src="" alt=""></a></div>
    <div class="cap2"><span class="cap2a">คลังองค์ธรรม</span><h1 class="cap2b" id="h1">เพราะอวิชชาดับ</h1></div>
    <div class="inner">
      <form class="search" id="sform" role="search">
        <input id="q" type="search" placeholder="พิมพ์คำที่ต้องการค้นหา" aria-label="ค้นหา">
        <button type="submit">ค้นหา</button>
      </form>
    </div>
    <div class="secs" id="secs"></div>
    <div class="secdots" id="secdots" aria-hidden="true"></div>
  </div></section>
  <main><div class="col pad">
    <section class="sec" id="results" hidden>
      <h2>ผลการค้นหา</h2>
      <p class="rsum" id="rsum"></p>
      <div class="notes" id="rlist"></div>
    </section>
    <section class="sec">
      <h2 id="ratanaHeading"></h2>
      <div class="ratana" id="ratana"></div>
    </section>
    <div class="foot" aria-hidden="true"><span class="orn"></span><span class="orn" style="font-size:1.4em"></span><span class="orn"></span></div>
  </div></main>
</div>

<div id="loginv" class="view" hidden>
  <main><div class="col pad login2">
    <img class="lglogo" id="lgLogo" src="" alt="">
    <h1>เข้าสู่ระบบ</h1>
    <div class="seg2" role="tablist">
      <button type="button" id="tabMember" class="on" role="tab">สมาชิก</button>
      <button type="button" id="tabAdmin" role="tab">แอดมิน</button>
    </div>
    <p class="lgnote" id="lgNote"></p>
    <form id="lgForm" class="lgform">
      <label class="fld" id="fName"><span>ชื่อ</span><input id="lgName" autocomplete="nickname" placeholder="ชื่อในกลุ่ม LINE"></label>
      <label class="fld" id="fAdminName" hidden><span>ชื่อแอดมิน</span><select id="lgAdminName"></select></label>
      <label class="fld"><span>รหัส</span><input id="lgCode" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]*"></label>
      <p class="dlgerr" id="lgErr" aria-live="polite"></p>
      <button type="submit" class="btn copy lgbtn">เข้าสู่ระบบ</button>
    </form>
    <p class="lgfine">ไม่มีรหัส ขอได้จากผู้ดูแลในกลุ่ม LINE</p>
  </div></main>
</div>

<div id="roomsv" class="view" hidden>
  <section class="roomshead2 sechead" id="roomsHead"><div class="col pad"><span id="roomsMed" aria-hidden="true"></span><h1 id="roomsHeading"></h1><p id="roomsSub"></p><div class="cardadmin"><button type="button" class="editlink" id="editRoomsCard" hidden>แก้ไขการ์ดหน้าแรก</button><button type="button" class="editlink" id="roomsCardPhoto" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.3" r="3.4"/></svg>รูปบนการ์ด</button><button type="button" class="editlink" id="roomsCover" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.3" r="3.4"/></svg>รูปพื้นหลังด้านบน</button><button type="button" class="editlink" id="roomsCoverDel" hidden>เอารูปพื้นหลังออก</button></div></div></section>
  <main><div class="col pad"><section class="sec">
    <div class="steps" id="rooms"></div>
    <button class="addbtn" id="addRoom" type="button" hidden>+ เพิ่มห้อง</button>
  </section></div></main>
</div>

<div id="roomv" class="view" hidden>
  <section class="roomhead roomphoto" id="roomhead"><div class="col pad">
    <button class="roomcam" id="roomPhotoBtn" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.3" r="3.4"/></svg>เปลี่ยนรูปห้อง</button>
    <span class="k" id="rk"></span>
    <h1 id="rh"></h1>
    <button class="editlink" id="editRoom" type="button" hidden>แก้ไข / ลบห้อง</button>
  </div></section>
  <main><div class="col pad">
    <section class="sec roomcard">
    <div class="roomdesc" id="rdesc" hidden><div class="rdtext" id="rdescText"></div><div class="rddiv" aria-hidden="true"><i></i><span class="orn"></span><i></i></div></div>
    <h2 id="rc"></h2>
    <div class="notes" id="nlist"></div>
    <button class="addbtn" id="addNote" type="button" hidden>+ เพิ่มองค์ธรรม</button>
  </section></div></main>
</div>

<div id="readv" class="view reader" hidden>
  <div class="col pad">
    <div class="crumb" id="crumb"></div>

    <article class="text" id="text"></article>
    <div class="noteadmin" id="noteAdmin" hidden>
      <button type="button" id="editNote">แก้ไของค์ธรรมนี้</button>
      <button type="button" id="delNote" class="danger">ลบองค์ธรรมนี้</button>
    </div>
  </div>
  <div class="actions"><div class="col pad">
    <button class="btn copy ib" id="copy" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>คัดลอก</span></button>
    <a class="btn line ib" id="share" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4C6.5 4 2 7.6 2 12c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3 0 .7 0 1l-.1.9c0 .3-.2 1 .9.5s5.8-3.4 7.9-5.9C21.3 15.3 22 13.7 22 12c0-4.4-4.5-8-10-8z" fill="currentColor"/></svg><span>ส่งต่อ LINE</span></a>
    <button class="btn propose ib" id="propose" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>เสนอเพิ่ม / แก้ไข</span></button>
    <div class="toast" id="toast" aria-live="polite"></div>
  </div></div>
</div>



<div id="personv" class="view" hidden>
  <section class="perhead"><div class="col pad" id="pphead"></div></section>
  <main><div class="col pad">
  <section class="sec reccard" id="pbio" hidden>
    <h2>ชีวประวัติย่อ</h2>
    <div class="biotext" id="pbioText"></div>
    <div class="empty" id="pbioEmpty">ยังไม่มีชีวประวัติย่อ</div>
    <button class="addbtn" id="editBio" type="button" hidden></button>
  </section>
  <section class="sec reccard" id="precs">
    <h2 id="ptitle"></h2>
    <div class="recs" id="plist2"></div>
    <button class="addbtn" id="addRec" type="button" hidden>+ เพิ่มบันทึกการบรรลุธรรม</button>
  </section>
  <button class="linkbtn" id="bioOnlyBtn" type="button" hidden></button></div></main>
</div>

<div id="sectionv" class="view" hidden>
  <section class="roomshead2 sechead" id="secHead"><div class="col pad">
    <span id="secMed"></span>
    <h1 id="secTitle"></h1><p id="secSub"></p>
    <div class="cardadmin" id="secAdmin" hidden><button type="button" class="editlink" id="editSec">แก้ไขหมวดนี้</button><button type="button" class="editlink" id="secPhoto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.3" r="3.4"/></svg>รูปบนการ์ด</button><button type="button" class="editlink" id="secCover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.3" r="3.4"/></svg>รูปพื้นหลังด้านบน</button><button type="button" class="editlink" id="secCoverDel" hidden>เอารูปพื้นหลังออก</button></div>
  </div></section>
  <main><div class="col pad"><section class="sec roomcard">
    <h2 id="secCount"></h2>
    <div class="notes" id="slist2"></div>
    <button class="addbtn" id="addItem" type="button">+ เพิ่มเนื้อหา</button>
  </section></div></main>
</div>

<div id="pendingv" class="view" hidden>
  <section class="roomhead"><div class="col pad"><h1>ข้อเสนอที่รอตรวจ</h1></div></section>
  <main><div class="col pad"><section class="sec"><div class="notes" id="plist"></div></section></div></main>
</div>

<div id="settingsv" class="view" hidden>
  <section class="roomhead"><div class="col pad"><h1>ตั้งค่ารหัส</h1></div></section>
  <main><div class="col pad"><section class="sec" id="slist"></section></div></main>
</div>

</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div id="dlgFields"></div>
    <div class="dlgbtns">
      <button type="button" id="dlgDel" class="dlgdel" hidden></button>
      <button type="button" id="dlgCancel">ยกเลิก</button>
      <button type="submit" id="dlgOk" class="primary">บันทึก</button>
    </div>
  </form>
</dialog>
<input type="file" id="picker" accept="image/*" hidden>

<script src="assets/app.js?v=20261016f"></script>
</body>
</html>
